name: Bug Report
description: Report a bug in DevLinks
labels: ["bug", "needs reproduction"]
body:
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: input
    id: actual
    attributes:
      label: Actual behaviour
    validations:
      required: true
